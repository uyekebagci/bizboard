spring:
  application:
    name: bizboard-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bizboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:15MB}

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,application/xml
  forward-headers-strategy: framework
  error:
    include-message: always

# WP a9da4e9d (USD+Altın): kur servisi cooldown (manuel "Anlık Güncelle" debounce).
exchange:
  # Dış API'ye (TCMB/frankfurter) min çağrı aralığı (sn). Cooldown'da cache döner.
  min-refresh-interval-sec: ${EXCHANGE_MIN_REFRESH_INTERVAL_SEC:30}

# WP 4b51cf42: Oturum güvenliği — sliding refresh + idle + absolute cap.
auth:
  # Son refresh'ten beri bu kadar dk hareketsizlik → oturum ölür (sessiz uzamaz).
  idle-timeout-min: ${AUTH_IDLE_TIMEOUT_MIN:30}
  # Oturum başlangıcından bu kadar saat sonra zorunlu yeniden giriş.
  absolute-session-hours: ${AUTH_ABSOLUTE_SESSION_HOURS:12}

app:
  # Telegram bot MVP — SECRET REPO'DA TUTULMAZ; yalnız env placeholder'ları.
  # Token boşsa kanal devre dışı (dispatch sessizce atlar); webhook secret boşsa
  # webhook 403 döner (kapalı). Yönetici Sevalla env'lerinden set eder.
  notifications:
    telegram:
      bot-token: ${APP_NOTIFICATIONS_TELEGRAM_BOT_TOKEN:}
      bot-username: ${APP_NOTIFICATIONS_TELEGRAM_BOT_USERNAME:}
      webhook-secret: ${APP_NOTIFICATIONS_TELEGRAM_WEBHOOK_SECRET:}

  # AI modülü (v1.1) — SECRET REPO'DA TUTULMAZ; yalnız env placeholder'ları.
  # Tüm anahtarlar boş varsayılan: anahtar yoksa ilgili sağlayıcı graceful kapanır
  # (app çökmez). Ana bayrak DEFAULT KAPALI — açıkça açılmadıkça hiçbir AI davranışı
  # tetiklenmez. Yönetici Sevalla env'lerinden set eder.
  ai:
    enabled: ${APP_AI_ENABLED:false}
    llm:
      # Anthropic Claude (Messages API) anahtarı. Boşsa LLM/RAG kapalı.
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${APP_AI_LLM_BASE_URL:https://api.anthropic.com/v1/messages}
      model: ${APP_AI_LLM_MODEL:claude-opus-4-8}
      anthropic-version: ${APP_AI_LLM_ANTHROPIC_VERSION:2023-06-01}
      max-tokens: ${APP_AI_LLM_MAX_TOKENS:1500}
      timeout-seconds: ${APP_AI_LLM_TIMEOUT_SECONDS:60}
    embedding:
      # Sağlayıcı: voyage (Anthropic-önerilen) veya openai. Anthropic embedding
      # endpoint'i SUNMAZ; bu yüzden pluggable. Anahtar boşsa embedding kapalı.
      provider: ${APP_AI_EMBEDDING_PROVIDER:voyage}
      api-key: ${AI_EMBEDDING_API_KEY:}
      voyage-base-url: ${APP_AI_EMBEDDING_VOYAGE_URL:https://api.voyageai.com/v1/embeddings}
      openai-base-url: ${APP_AI_EMBEDDING_OPENAI_URL:https://api.openai.com/v1/embeddings}
      model: ${APP_AI_EMBEDDING_MODEL:voyage-3}
      timeout-seconds: ${APP_AI_EMBEDDING_TIMEOUT_SECONDS:30}
      batch-size: ${APP_AI_EMBEDDING_BATCH_SIZE:32}
    rag:
      enabled: ${APP_AI_RAG_ENABLED:true}
      top-k: ${APP_AI_RAG_TOP_K:8}
    anomaly:
      # Anomali tespit job'ı — DEFAULT KAPALI (spam-kaçın). Ayrıca işletme-başına
      # opt-in gerekir (SystemSetting ai.anomaly.enabled:<businessId>).
      enabled: ${APP_AI_ANOMALY_ENABLED:false}
      cron: ${APP_AI_ANOMALY_CRON:0 15 7 * * *}
      stdev-factor: ${APP_AI_ANOMALY_STDEV_FACTOR:3.0}
      lookback-days: ${APP_AI_ANOMALY_LOOKBACK_DAYS:90}
      min-samples: ${APP_AI_ANOMALY_MIN_SAMPLES:8}

  jwt:
    secret: ${JWT_SECRET:bizboard-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
    # Access token TTL — 30 dakika. Refresh akışı eklendi (v1.1.0); access kısa
    # tutmak çalınmış token'ın penceresini daraltır. Aktif kullanıcı sessiz refresh
    # ile yenilenir; idle kullanıcı 30 dk sonra erişimini kaybeder, bir sonraki
    # API çağrısında otomatik refresh çalışır (refresh süresi içindeyken).
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}  # 30 min

  refresh:
    # Refresh token toplam süresi. Bu süre içinde silent refresh ile access token
    # yenilenebilir; süre dolunca tekrar login gerekir.
    duration-days: ${APP_REFRESH_DURATION_DAYS:30}
    cookie:
      name:      ${APP_REFRESH_COOKIE_NAME:rt}
      # Production HTTPS'de Secure zorunlu. Local dev için override edilebilir.
      secure:    ${APP_REFRESH_COOKIE_SECURE:true}
      # Frontend ile backend farklı subdomain'lerdeyse (sevalla.app) cross-site AJAX
      # için "None" gerekiyor. Aynı parent domain'e geçilirse "Lax" yapılabilir.
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:None}
      # Cookie sadece /auth/* path'ine gönderilir → diğer endpoint'ler asla görmez.
      path:      ${APP_REFRESH_COOKIE_PATH:/auth}
      # Boş bırakıldığında host'a bağlı. Parent domain ile paylaşmak için: ".cakirdag.com".
      domain:    ${APP_REFRESH_COOKIE_DOMAIN:}

  cors:
    # Comma-separated list of allowed origins for production frontend(s).
    # Example: APP_CORS_ALLOWED_ORIGINS=https://app.example.com,https://test.example.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  storage:
    # "local" → write files to disk under app.storage.local.root
    # "s3"    → write files to S3-compatible object storage (Sevalla, AWS, R2, MinIO, …)
    type: ${APP_STORAGE_TYPE:local}

    local:
      root: ${APP_STORAGE_LOCAL_ROOT:./uploads}

    s3:
      bucket:      ${APP_STORAGE_S3_BUCKET:}
      region:      ${APP_STORAGE_S3_REGION:auto}
      # Set endpoint for non-AWS S3-compatible providers (Sevalla Object Storage,
      # Cloudflare R2, Backblaze B2, MinIO, etc.). Leave blank for AWS S3.
      endpoint:    ${APP_STORAGE_S3_ENDPOINT:}
      access-key:  ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-key:  ${APP_STORAGE_S3_SECRET_KEY:}
      # Path-style addressing is required by most non-AWS S3 providers.
      path-style:  ${APP_STORAGE_S3_PATH_STYLE:true}
      # Prefix all object keys (useful for sharing one bucket between envs).
      prefix:      ${APP_STORAGE_S3_PREFIX:}

  file:
    # Maximum size of a single uploaded file in bytes (10 MB by default).
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:10485760}

  # OCR Modülü (WP 1bdb8116) — belge tarama. SECRET REPO'DA TUTULMAZ; yalnız env
  # placeholder'ları. MINDEE_API_KEY boşsa Mindee devre dışı → Tesseract fallback
  # (binary deploy imajında kurulu olmalı) → o da yoksa graceful degrade (FAILED
  # tarama; kullanıcı alanları manuel girer). Yönetici Sevalla env'lerinden set eder.
  ocr:
    enabled: ${APP_OCR_ENABLED:true}
    # Birincil sağlayıcı: mindee | tesseract.
    provider: ${APP_OCR_PROVIDER:mindee}
    # Birincil başarısızsa diğerine düş.
    fallback-enabled: ${APP_OCR_FALLBACK_ENABLED:true}
    # Tek dosya üst sınırı (8 MB).
    max-file-size-bytes: ${APP_OCR_MAX_FILE_SIZE_BYTES:8388608}
    # Bulk upload tek istekte azami dosya sayısı.
    bulk-max-files: ${APP_OCR_BULK_MAX_FILES:20}
    mindee:
      api-key: ${MINDEE_API_KEY:}
      base-url: ${APP_OCR_MINDEE_BASE_URL:https://api.mindee.net/v1}
      account: ${APP_OCR_MINDEE_ACCOUNT:mindee}
      receipt-model: ${APP_OCR_MINDEE_RECEIPT_MODEL:expense_receipts}
      receipt-version: ${APP_OCR_MINDEE_RECEIPT_VERSION:5}
      invoice-model: ${APP_OCR_MINDEE_INVOICE_MODEL:invoices}
      invoice-version: ${APP_OCR_MINDEE_INVOICE_VERSION:4}
      timeout-seconds: ${APP_OCR_MINDEE_TIMEOUT_SECONDS:25}
    tesseract:
      # Deploy imajına tesseract-ocr + tesseract-ocr-tur KURULU olmalı (OPS NOTU).
      binary-path: ${APP_OCR_TESSERACT_BINARY:tesseract}
      languages: ${APP_OCR_TESSERACT_LANGS:tur+eng}
      timeout-seconds: ${APP_OCR_TESSERACT_TIMEOUT_SECONDS:30}

  audit:
    # Toggle audit logging of file downloads.
    log-file-downloads: ${AUDIT_LOG_FILE_DOWNLOADS:true}
    # Retention: bu günden eski kayıtlar silinir (0 = süresiz sakla).
    retention-days: ${APP_AUDIT_RETENTION_DAYS:90}
    # mod-audit (KVKK): bu günden eski kayıtların PII alanları silmeden ÖNCE
    # anonimleştirilir (0 = kapalı). Genelde retention-days'ten KISA tutulur:
    # PII erken kaldırılır, yapısal forensik iz daha uzun saklanır.
    anonymize-after-days: ${APP_AUDIT_ANONYMIZE_AFTER_DAYS:0}

  external-integrations:
    # Disable in test environment to prevent emails/SMS/webhooks reaching real users.
    enabled: ${APP_EXTERNAL_INTEGRATIONS_ENABLED:true}

  # e-Fatura modülü (Çatı v1.1) — entegratör-pluggable.
  # SECRET REPO'DA TUTULMAZ; yalnız env placeholder'ları. Hiçbiri set
  # edilmezse modül "no-op" çalışır: UBL-TR XML üretimi + önizleme + indirme
  # tam çalışır, GİB'e gönderim "entegratör yapılandırılmadı" der (graceful).
  efatura:
    # Aktif entegratör anahtarı. "noop" (default) = gönderim devre dışı.
    # Gerçek entegratör eklenince "foriba" / "uyumsoft" / "qnb" gibi set edilir;
    # o entegratörün EInvoiceIntegrator bean'i credentials'ı kendi env'inden okur.
    integrator: ${APP_EFATURA_INTEGRATOR:noop}
    sign:
      # Mali mühür / e-imza sertifikası (PKCS#12) — kullanıcının ops/legal adımı.
      # Boşsa imzalama devre dışı; XML imzasız üretilir (önizleme/indirme yeterli).
      cert-path:     ${APP_EFATURA_SIGN_CERT_PATH:}
      cert-password: ${APP_EFATURA_SIGN_CERT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    profile: ${spring.profiles.active}

# v1.1 small-win: requestId/correlation-id'yi dev loglarına da bas.
# RequestIdFilter MDC'ye "requestId" koyar; %X{requestId:-} bunu yazar
# (yoksa "-"). Prod pattern application-prod.yml'de tanımlı.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
