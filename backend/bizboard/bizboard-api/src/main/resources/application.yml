spring:
  application:
    name: bizboard-api

  datasource:
    url: jdbc:postgresql://localhost:5432/bizboard
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:bizboard-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
    expiration-ms: 604800000  # 7 days

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 15MB

app.file:
  upload-dir: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health
